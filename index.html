<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#087f78"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="G&S Yahtzee"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>Gerrie & Sabrina Yahtzee</title>
<style>
:root{--t:#087f78;--n:#173b60;--bg:#f2f5f7;--line:#dce3e8;--gold:#fff0b8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#17212b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;padding-bottom:85px}header{background:var(--t);color:white;padding:calc(15px + env(safe-area-inset-top)) 17px 15px;position:sticky;top:0;z-index:3}.brand{font-weight:850;font-size:19px}.sub{font-size:12px;opacity:.85;margin-top:3px}main{max-width:680px;margin:auto;padding:13px}.players{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:12px}.player,.panel{background:white;border-radius:15px;padding:13px;box-shadow:0 5px 20px #173b6014}.player.active{outline:2px solid var(--t);background:#e8f7f5}.pname{font-weight:750;font-size:14px}.total{font-size:28px;font-weight:850;color:var(--n)}.hint,.note{font-size:12px;color:#64748b}.status{background:var(--n);color:white;border-radius:13px;padding:12px;margin:12px 0;display:flex;justify-content:space-between;gap:8px}.heading{font-size:12px;font-weight:850;color:#64748b;letter-spacing:.7px;margin:17px 3px 8px;text-transform:uppercase}.sheet{background:white;border-radius:15px;overflow:hidden;box-shadow:0 5px 20px #173b6014}.cat{width:100%;display:flex;justify-content:space-between;align-items:center;text-align:left;background:white;padding:14px;border:0;border-bottom:1px solid var(--line);min-height:55px}.cat:nth-child(even){background:#f7f9fa}.cat.last{background:var(--gold)!important;box-shadow:inset 5px 0 var(--t)}.cat:disabled{opacity:1}.cat strong{font-size:16px}.score{font-size:19px;font-weight:850;color:var(--n)}.empty{color:#a0aab4}.tot{display:flex;justify-content:space-between;padding:12px 14px;background:#edf2f5;border-bottom:1px solid var(--line);font-weight:750}.final{background:var(--n);color:white;font-size:18px}.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:13px 0}.tool,.primary,.secondary,.danger{border:0;border-radius:12px;padding:13px 7px;font-weight:800}.tool{background:white;color:var(--n);box-shadow:0 4px 16px #173b6014;font-size:12px}.tool b{display:block;font-size:19px}.primary{background:var(--t);color:white}.secondary{background:#e9eef2;color:var(--n)}.danger{background:#fff0f0;color:#a52c2c}.bottom{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);z-index:4}.nav{background:white;color:#64748b;font-size:11px;font-weight:750;padding:5px}.nav b{display:block;font-size:19px}.nav.on{color:var(--t)}.overlay{position:fixed;inset:0;background:#071827bb;display:none;align-items:flex-end;justify-content:center;padding:10px;z-index:10}.overlay.show{display:flex}.dialog{width:min(100%,500px);max-height:88dvh;overflow:auto;background:white;border-radius:22px;padding:20px}.dialog h2{margin:0 0 7px;color:var(--n);font-size:22px}.dialog p{font-size:14px;color:#64748b;line-height:1.4}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.choice{border:2px solid var(--line);background:#f8fafb;border-radius:12px;min-height:60px;font-size:22px;font-weight:850;color:var(--n)}.choice:active{background:#e3f5f2;border-color:var(--t)}.actions{display:flex;gap:8px;margin-top:14px}.actions button{flex:1}.field{margin:10px 0}.field label{display:block;font-weight:750;font-size:13px;margin-bottom:5px}.field input,.field select{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit;font-size:16px}.row{display:flex;justify-content:space-between;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--n);color:white;padding:12px 18px;border-radius:12px;opacity:0;z-index:20;font-weight:800;pointer-events:none}.toast.show{opacity:1}@media(min-width:600px){.overlay{align-items:center}}
</style></head><body><header><div class="brand">🎲 Gerrie & Sabrina Yahtzee</div><div class="sub">Klassieke Yahtzee · lokaal opgeslagen</div></header><main id="app"></main><nav class="bottom"><button class="nav on" data-tab="spel"><b>🎲</b>Spel</button><button class="nav" data-tab="klassement"><b>🏆</b>Klassement</button><button class="nav" data-tab="historie"><b>📚</b>Historie</button><button class="nav" data-tab="acties"><b>☰</b>Acties</button></nav><div class="overlay" id="ov"><div class="dialog" id="dlg"></div></div><div class="toast" id="toast"></div>
<script>
const KEY='gs-yatzee-local-v1',cats=[['ones','Enen','upper',1],['twos','Tweeën','upper',2],['threes','Drieën','upper',3],['fours','Vieren','upper',4],['fives','Vijven','upper',5],['sixes','Zessen','upper',6],['three','Three of a Kind','sum'],['four','Four of a Kind','sum'],['full','Full House','fixed',25],['small','Kleine straat','fixed',30],['large','Grote straat','fixed',40],['yahtzee','Yahtzee','fixed',50],['chance','Chance','sum']];
const mk=n=>({name:n,scores:{},yb:0});let S=read(),tab='spel',undoStack=[],last=null;
function read(){try{return JSON.parse(localStorage.getItem(KEY))||{players:[mk('Gerrie'),mk('Sabrina')],active:0,started:false,history:[],game:0}}catch(e){return {players:[mk('Gerrie'),mk('Sabrina')],active:0,started:false,history:[],game:0}}}
function save(){localStorage.setItem(KEY,JSON.stringify(S))}function snap(){undoStack.push(JSON.stringify(S));if(undoStack.length>40)undoStack.shift()}
function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function up(p){return cats.slice(0,6).reduce((s,c)=>s+(+p.scores[c[0]]||0),0)}function low(p){return cats.slice(6).reduce((s,c)=>s+(+p.scores[c[0]]||0),0)}function total(p){return up(p)+(up(p)>=63?35:0)+low(p)+p.yb*100}function done(p){return cats.every(c=>p.scores[c[0]]!==undefined)}
function next(){for(let k=1;k<=S.players.length;k++){let i=(S.active+k)%S.players.length;if(!done(S.players[i]))return i}return S.active}
function modal(x){dlg.innerHTML=x;ov.classList.add('show')}function close(){ov.classList.remove('show')}function say(x){toast.textContent=x;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1400)}
function render(){document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));app.innerHTML=tab==='spel'?gameUI():tab==='klassement'?standUI():tab==='historie'?historyUI():actionsUI()}
function gameUI(){if(!S.started)return `<div class="panel"><h2>Welkom bij Yahtzee!</h2><p>Start een nieuwe partij om te beginnen.</p><button class="primary" style="width:100%" onclick="newGame()">＋ Nieuwe partij</button></div>`;
let p=S.players[S.active],ps=S.players.map((x,i)=>`<div class="player ${i===S.active?'active':''}"><div class="pname">${esc(x.name)}</div><div class="total">${total(x)}</div><div class="hint">${done(x)?'Klaar':i===S.active?'Aan de beurt':'Wacht op beurt'}</div></div>`).join('');
let list=cats.map((c,i)=>`<button class="cat ${last&&last.i===S.active&&last.id===c[0]?'last':''}" ${p.scores[c[0]]===undefined?`onclick="pick('${c[0]}')"`:'disabled'}><strong>${c[1]}${i<6?`<small style="display:block;font-size:11px;color:#64748b;font-weight:500">Tel alle ${i+1}en bij elkaar op</small>`:''}</strong><span class="score ${p.scores[c[0]]===undefined?'empty':''}">${p.scores[c[0]]===undefined?'＋':p.scores[c[0]]}</span></button>`).join('');
return `<div class="players">${ps}</div><div class="status"><strong>${done(p)?'Partij compleet':'Beurt: '+esc(p.name)}</strong><span>Ronde ${Object.keys(p.scores).length+1}/13</span></div><div class="heading">Bovenste gedeelte</div><div class="sheet">${list.split('</button>').slice(0,6).join('</button>')+'</button>'}</div><div class="heading">Onderste gedeelte</div><div class="sheet">${list.split('</button>').slice(6).join('</button>')}</div><div class="heading">Totaal ${esc(p.name)}</div><div class="sheet"><div class="tot"><span>Totaal boven</span><span>${up(p)}</span></div><div class="tot"><span>Bonus vanaf 63</span><span>${up(p)>=63?35:0}</span></div><div class="tot"><span>Extra Yahtzee (${p.yb} × 100)</span><span>${p.yb*100}</span></div><div class="tot"><span>Totaal onder</span><span>${low(p)}</span></div><div class="tot final"><span>Eindtotaal</span><span>${total(p)}</span></div></div><div class="tools"><button class="tool" onclick="undo()"><b>↶</b>Herstel</button><button class="tool" onclick="editScores()"><b>✎</b>Wijzig score</button><button class="tool" onclick="extra()"><b>🎲</b>Extra Yahtzee</button></div>`}
function standUI(){return `<h2>🏆 Klassement huidige partij</h2>${S.players.map((p,i)=>`<div class="row"><b>${i+1}. ${esc(p.name)}</b><strong>${total(p)} punten</strong></div>`).join('')}`}
function historyUI(){return `<h2>📚 Historie</h2>${S.history.length?S.history.slice().reverse().map(h=>`<div class="row"><div><b>Partij ${h.game}</b><div class="hint">${new Date(h.date).toLocaleString('nl-NL')}</div></div><b>${esc(h.winner)}</b></div>`).join(''):'<p>Nog geen opgeslagen partijen.</p>'}`}
function actionsUI(){return `<h2>Spelbeheer</h2><button class="primary" style="width:100%;margin:6px 0" onclick="newGame()">＋ Nieuwe partij</button><button class="secondary" style="width:100%;margin:6px 0" onclick="saveGame()">Partij opslaan in historie</button><button class="secondary" style="width:100%;margin:6px 0" onclick="rename()">Spelers aanpassen</button><button class="secondary" style="width:100%;margin:6px 0" onclick="undo()">Laatste actie herstellen</button><button class="danger" style="width:100%;margin:6px 0" onclick="clearHist()">Historie wissen</button><p class="note">Gegevens worden alleen op dit apparaat bewaard. Maak regelmatig een reservekopie via Instellingen in de volgende versie.</p>`}
function pick(id){let c=cats.find(x=>x[0]===id),opts=c[2]==='upper'?Array.from({length:6},(_,i)=>i*c[3]):c[2]==='fixed'?[0,c[3]]:[0,...Array.from({length:26},(_,i)=>i+5)];modal(`<h2>${c[1]}</h2><p>Kies de score voor ${esc(S.players[S.active].name)}.</p><div class="grid">${opts.map(v=>`<button class="choice" onclick="score('${id}',${v})">${v}</button>`).join('')}</div><div class="actions"><button class="secondary" onclick="close()">Annuleren</button></div>`)}
function score(id,v){snap();let who=S.active;S.players[who].scores[id]=v;last={i:who,id};save();close();render();say(`${S.players[who].name}: ${v} punten`);setTimeout(()=>{if(last&&last.i===who&&last.id===id){S.active=next();last=null;save();render()}},1500)}
function undo(){if(!undoStack.length){say('Geen actie om te herstellen');return}S=JSON.parse(undoStack.pop());last=null;save();render();say('Laatste actie hersteld')}
function editScores(){let p=S.players[S.active],a=cats.filter(c=>p.scores[c[0]]!==undefined);if(!a.length)return say('Nog geen scores');modal(`<h2>Score wijzigen</h2>${a.map(c=>`<button class="cat" onclick="editOne('${c[0]}')"><strong>${c[1]}</strong><span class="score">${p.scores[c[0]]}</span></button>`).join('')}<div class="actions"><button class="secondary" onclick="close()">Sluiten</button></div>`)}
function editOne(id){let c=cats.find(x=>x[0]===id),opts=c[2]==='upper'?Array.from({length:6},(_,i)=>i*c[3]):c[2]==='fixed'?[0,c[3]]:[0,...Array.from({length:26},(_,i)=>i+5)];modal(`<h2>${c[1]} wijzigen</h2><div class="grid">${opts.map(v=>`<button class="choice" onclick="setEdit('${id}',${v})">${v}</button>`).join('')}</div><button class="danger" style="width:100%;margin-top:10px" onclick="erase('${id}')">Categorie leegmaken</button>`)}
function setEdit(id,v){snap();S.players[S.active].scores[id]=v;save();close();render();say('Score gewijzigd')}function erase(id){snap();delete S.players[S.active].scores[id];save();close();render();say('Score verwijderd')}
function extra(){let p=S.players[S.active];if(p.scores.yahtzee!==50)return say('Eerst Yahtzee met 50 punten invullen');modal(`<h2>Extra Yahtzee</h2><p>Een extra Yahtzee levert 100 bonuspunten op. Bevestig alleen als je daadwerkelijk opnieuw Yahtzee hebt gegooid.</p><div class="actions"><button class="secondary" onclick="close()">Annuleren</button><button class="primary" onclick="extraOK()">+100 punten</button></div><p class="note">Jokerregels voor de categorie-invulling zijn in deze eerste versie nog niet volledig geautomatiseerd.</p>`)}
function extraOK(){snap();S.players[S.active].yb++;save();close();render();say('+100 Yahtzee-bonus')}
function newGame(){modal(`<h2>Nieuwe partij</h2><p>Met dezelfde spelers verder spelen?</p><div class="actions"><button class="primary" onclick="startSame()">Ja, dezelfde</button><button class="secondary" onclick="newNames()">Andere spelers</button></div><div class="actions"><button class="secondary" onclick="close()">Annuleren</button></div>`)}
function startSame(){begin(S.players.map(p=>p.name))}
function newNames(){modal(`<h2>Spelers instellen</h2><div class="field"><label>Aantal spelers</label><select id="num" onchange="namesForm()">${[2,3,4,5,6].map(n=>`<option>${n}</option>`).join('')}</select></div><div id="names"></div><div class="actions"><button class="secondary" onclick="close()">Annuleren</button><button class="primary" onclick="createNames()">Start</button></div>`);namesForm()}
function namesForm(){let n=+document.getElementById('num').value;document.getElementById('names').innerHTML=Array.from({length:n},(_,i)=>`<div class="field"><label>Speler ${i+1}</label><input class="nm" value="${['Gerrie','Sabrina','Speler 3','Speler 4','Speler 5','Speler 6'][i]}"></div>`).join('')}
function createNames(){begin(Array.from(document.querySelectorAll('.nm')).map(x=>x.value.trim()||'Speler'))}
function begin(names){snap();S.players=names.map(mk);S.active=0;S.started=true;S.game++;last=null;save();close();tab='spel';render();say('Nieuwe partij gestart')}
function saveGame(){if(!S.started)return say('Geen actieve partij');let sorted=S.players.slice().sort((a,b)=>total(b)-total(a));S.history.push({game:S.game,date:new Date().toISOString(),winner:total(sorted[0])===total(sorted[1])?'Gelijkspel':sorted[0].name,scores:S.players.map(p=>({name:p.name,score:total(p)}))});save();tab='historie';render();say('Partij opgeslagen')}
function rename(){modal(`<h2>Spelers aanpassen</h2>${S.players.map((p,i)=>`<div class="field"><label>Speler ${i+1}</label><input id="rn${i}" value="${esc(p.name)}"></div>`).join('')}<div class="actions"><button class="secondary" onclick="close()">Annuleren</button><button class="primary" onclick="renameOK()">Opslaan</button></div>`)}
function renameOK(){snap();S.players.forEach((p,i)=>p.name=document.getElementById('rn'+i).value.trim()||p.name);save();close();render()}
function clearHist(){modal(`<h2>Historie wissen?</h2><p>De opgeslagen historie wordt verwijderd. De huidige partij blijft staan.</p><div class="actions"><button class="secondary" onclick="close()">Annuleren</button><button class="danger" onclick="S.history=[];save();close();render()">Wissen</button></div>`)}
document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});ov.onclick=e=>{if(e.target===ov)close()};if('serviceWorker'in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));render();
</script></body></html>
